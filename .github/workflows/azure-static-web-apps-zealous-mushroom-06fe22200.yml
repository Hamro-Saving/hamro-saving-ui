name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      # The deploy container resolves which Static Web App to target from the OIDC
      # workflow reference, so it needs to mint an id token. That reference also
      # embeds this file's name -- renaming it fails with "Could not determine the
      # Static Web App from the GitHub OIDC workflow reference".
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires ^20.19.0 || >=22.12.0. Oryx's default is older than that,
          # so we build here and hand Azure the finished dist/ instead.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Baked into the bundle at build time, so it is public either way -- no secret.
          # Set a VITE_API_URL repo variable to point a deploy somewhere else.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://sathi-bachat-api-d9ccfageb5cpffcp.southeastasia-01.azurewebsites.net' }}
        run: npm run build

      # This Static Web App has deploymentAuthPolicy: GitHub, so it accepts OIDC only
      # and rejects every API key with "No matching Static Web App was found or the api
      # key was invalid". The runner warns that github_id_token is an unexpected input
      # -- the action.yml it resolves is older than the container -- but the container
      # does read INPUT_GITHUB_ID_TOKEN, so the warning is cosmetic and these steps are
      # load-bearing. Do not remove them.
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MUSHROOM_06FE22200 }}
          action: "upload"
          # With skip_app_build the build output is not derived, so app_location IS the
          # artifact folder and output_location is ignored. Pointing app_location at "/"
          # published the whole repo root -- /src, /package.json and /vite.config.ts were
          # served publicly while /assets 404'd. It must point at dist.
          app_location: "dist"
          api_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MUSHROOM_06FE22200 }}
          action: "close"
